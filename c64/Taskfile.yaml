---
version: '3'

dotenv:
  - '.env'

vars:
  DEMO_IMAGE: ../examples/ateam.jpg

tasks:
  default:
    desc: Build all programs
    sources:
      - "**/*.asm"
    deps:
      - koala.prg
      - hires.prg
      - mixedhires.prg

  # Reusable KickAss compilation task
  kickass:
    internal: true
    desc: Compile a program with KickAss
    cmds:
      - java -jar $KICKASS -debugdump -bytedumpfile "{{.BASE}}.prg.txt" -symbolfile
        -vicesymbols -libdir ./lib -o "{{.BASE}}.prg" "{{.BASE}}.asm"

  # Assembly tasks
  koala.prg:
    deps:
      - paintface.koala.bin
    cmds:
      - task: kickass
        vars:
          BASE: koala
    sources:
      - paintface.koala.bin
      - "**/*.asm"
    generates:
      - koala.prg

  paintface.koala.bin:
    cmds:
      - retrospex -f bin -m koala -resize -o "paintface.koala.bin" {{.DEMO_IMAGE}}
    sources:
      - "{{.DEMO_IMAGE}}"
    generates:
      - paintface.koala.bin

  hires.prg:
    deps:
      - paintface.hires.bin
    cmds:
      - task: kickass
        vars:
          BASE: hires
    sources:
      - paintface.hires.bin
      - "**/*.asm"
    generates:
      - hires.prg

  mixedhires.prg:
    deps:
      - paintface.mixedhires.bin
    cmds:
      - task: kickass
        vars:
          BASE: mixedhires
    sources:
      - paintface.mixedhires.bin
      - "**/*.asm"
    generates:
      - mixedhires.prg

  paintface.hires.bin:
    desc: Convert hires image to binary
    cmds:
      - retrospex -f bin -m hires -resize -o "paintface.hires.bin" {{.DEMO_IMAGE}}
    sources:
      - "{{.DEMO_IMAGE}}"
    generates:
      - paintface.hires.bin

  paintface.mixedhires.bin:
    desc: Convert mixedhires image to binary
    cmds:
      - retrospex -f bin -m mixedhires -resize -o "paintface.mixedhires.bin" {{.DEMO_IMAGE}}
    sources:
      - "{{.DEMO_IMAGE}}"
    generates:
      - paintface.mixedhires.bin

  # Cleanup tasks
  clean:
    desc: Clean all generated files
    cmds:
      - for:
          - bin
          - prg
          - exe.prg
          - sym
          - vs
          - dbg
          - d64
          - out
          - map
          - labels
          - txt
          - 1.png
        cmd: rm -f *.{{ .ITEM }}
